name: Build & Release EXE

# Triggers:
#  • Push a tag like v1.0.0  →  builds claw.exe and creates a GitHub Release
#  • Manual run from the Actions tab (workflow_dispatch) for testing
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  build:
    name: Build claw.exe (Windows)
    runs-on: windows-latest

    steps:
      # ── checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Node / frontend ───────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build
        # produces frontend/dist/

      # ── Python / backend ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # ── PyInstaller ───────────────────────────────────────────────────────
      - name: Build EXE with PyInstaller
        working-directory: backend
        run: pyinstaller claw.spec --noconfirm --clean

      # Sanity-check: make sure the file was actually produced
      - name: Verify claw.exe exists
        run: |
          if (!(Test-Path "backend\dist\claw.exe")) {
            Write-Error "claw.exe not found!"
            exit 1
          }
          $size = (Get-Item "backend\dist\claw.exe").Length / 1MB
          Write-Host ("claw.exe size: {0:N1} MB" -f $size)
        shell: pwsh

      # ── Upload artifact (available even on manual runs / non-tag pushes) ──
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: claw-windows-exe
          path: backend/dist/claw.exe
          retention-days: 30

      # ── Create GitHub Release (only on version tags) ───────────────────────
      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: |
          cat << 'EOF' >> $GITHUB_OUTPUT
          notes<<ENDNOTES
          ## claw ${{ steps.version.outputs.version }}

          **Загрузка и запуск:**
          1. Скачай `claw.exe` ниже
          2. Запусти — браузер откроется автоматически на `http://127.0.0.1:8765`
          3. При первом запуске в `%LOCALAPPDATA%\claw\.env` появится шаблон для токенов
          4. Для системного трея нужен Windows 10/11

          **Что внутри:**
          - Изометрическая рабочая комната с ИИ-агентами
          - Мониторинг процессов и системных ресурсов (CPU/RAM/Disk/Net)
          - Встроенный PTY-терминал (PowerShell/cmd)
          - Коннекторы: ВКонтакте, Telegram, Discord, Steam, Spotify
          - LLM: Ollama (локально), Qwen local (vLLM/LM Studio), Qwen cloud (DashScope)
          - Tool-calling: агенты могут вызывать инструменты и делегировать задачи друг другу

          **Требования:** Windows 10/11 x64, Ollama или любой OpenAI-совместимый сервер
          ENDNOTES
          EOF
        shell: bash

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: claw ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: backend/dist/claw.exe
